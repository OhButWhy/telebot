version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: studmarket_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: studmarket_user
      POSTGRES_PASSWORD: studmarket_pass
      POSTGRES_DB: studmarket_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studmarket_user -d studmarket_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:7.5
    container_name: studmarket_pgadmin
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmin_data:
